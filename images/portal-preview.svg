<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" height="100%">
  <defs>
    <linearGradient id="spBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#1C2541" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="760" height="380" rx="8" fill="url(#spBg)" stroke="#334155" stroke-width="1.5"/>

  <!-- Browser Frame Header -->
  <rect x="0" y="0" width="760" height="38" rx="8" fill="#0F172A"/>
  <rect x="0" y="30" width="760" height="8" fill="#0F172A"/>
  <circle cx="20" cy="19" r="5" fill="#EF4444" />
  <circle cx="36" cy="19" r="5" fill="#F59E0B" />
  <circle cx="52" cy="19" r="5" fill="#10B981" />
  <rect x="80" y="10" width="420" height="18" rx="4" fill="#020617"/>
  <text x="92" y="23" font-family="'JetBrains Mono', monospace" font-size="11" fill="#60A5FA">projects/student-portal/ — Academic Records &amp; Course Flow</text>

  <!-- Split View Left: Student Information & Academic Schedule -->
  <g transform="translate(24, 54)">
    <rect width="360" height="236" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
    <rect x="0" y="0" width="360" height="30" rx="6" fill="url(#headerGrad)"/>
    <text x="16" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">STUDENT PORTAL // ACADEMIC DASHBOARD</text>

    <!-- Student Info Card -->
    <g transform="translate(16, 40)">
      <rect width="328" height="64" rx="4" fill="#020617" stroke="#1E293B"/>
      <circle cx="34" cy="32" r="18" fill="#1D4ED8"/>
      <text x="26" y="37" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#FFFFFF">PJ</text>
      <text x="64" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">Payanshi Jain</text>
      <text x="64" y="42" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">ID: SST2026 // B.Tech Computer Science</text>
      <text x="64" y="54" font-family="'JetBrains Mono', monospace" font-size="9" fill="#34D399">Status: Active Matriculation · Scaler &amp; BITS Pilani</text>
    </g>

    <!-- Course Schedule Table -->
    <g transform="translate(16, 114)">
      <rect width="328" height="106" rx="4" fill="#020617" stroke="#1E293B"/>
