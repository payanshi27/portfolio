      <rect width="328" height="22" rx="4" fill="#1E293B"/>
      <text x="10" y="15" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#93C5FD">CODE</text>
      <text x="64" y="15" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#93C5FD">COURSE NAME</text>
      <text x="210" y="15" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#93C5FD">CREDITS</text>
      <text x="270" y="15" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#93C5FD">STATUS</text>

      <!-- Row 1 -->
      <text x="10" y="38" font-family="'JetBrains Mono', monospace" font-size="9" fill="#F8FAFC">CS101</text>
      <text x="64" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#CBD5E1">Web Systems &amp; CSS3 3D</text>
      <text x="220" y="38" font-family="'JetBrains Mono', monospace" font-size="9" fill="#F8FAFC">4.0</text>
      <text x="270" y="38" font-family="'JetBrains Mono', monospace" font-size="9" fill="#34D399">COMPLETED</text>

      <!-- Row 2 -->
      <text x="10" y="60" font-family="'JetBrains Mono', monospace" font-size="9" fill="#F8FAFC">CS201</text>
      <text x="64" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#CBD5E1">Data Structures &amp; Java</text>
      <text x="220" y="60" font-family="'JetBrains Mono', monospace" font-size="9" fill="#F8FAFC">4.0</text>
      <text x="270" y="60" font-family="'JetBrains Mono', monospace" font-size="9" fill="#60A5FA">ENROLLED</text>

      <!-- Row 3 -->
      <text x="10" y="82" font-family="'JetBrains Mono', monospace" font-size="9" fill="#F8FAFC">SE302</text>
      <text x="64" y="82" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#CBD5E1">Distributed Concurrency</text>
      <text x="220" y="82" font-family="'JetBrains Mono', monospace" font-size="9" fill="#F8FAFC">3.0</text>
      <text x="270" y="82" font-family="'JetBrains Mono', monospace" font-size="9" fill="#F59E0B">PLANNED</text>
    </g>
  </g>

  <!-- Right: Course Registration Form Model -->
  <g transform="translate(404, 54)">
    <rect width="332" height="236" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
    <text x="16" y="26" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#34D399">Registration Flow &amp; Validation Specs</text>

    <g font-family="'JetBrains Mono', monospace" font-size="10" transform="translate(16, 40)">
      <rect width="300" height="32" rx="4" fill="#020617" stroke="#1E293B"/>
      <text x="10" y="20" fill="#94A3B8">Input: Student ID [2026-CS-0418]</text>

      <rect y="38" width="300" height="32" rx="4" fill="#020617" stroke="#1E293B"/>
      <text x="10" y="58" fill="#94A3B8">Select Department: [Computer Science ▾]</text>

      <rect y="76" width="300" height="32" rx="4" fill="#020617" stroke="#1E293B"/>
      <text x="10" y="96" fill="#34D399">✓ Form Validation: Semantic Constraints</text>

      <rect y="114" width="300" height="60" rx="4" fill="#020617" stroke="#1E293B"/>
      <text x="10" y="134" fill="#60A5FA">&lt;form action="..." method="post"&gt;</text>
      <text x="10" y="150" fill="#F8FAFC">  &lt;table aria-label="Course Grid"&gt;</text>
      <text x="10" y="166" fill="#94A3B8">  High-contrast WCAG 2.1 AAA accessible</text>
    </g>
  </g>

  <!-- Bottom Guaranteed Bar -->
  <g transform="translate(24, 304)">
    <rect width="712" height="56" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <circle cx="28" cy="28" r="8" fill="#10B981" opacity="0.3"/>
    <circle cx="28" cy="28" r="4" fill="#10B981"/>
    <text x="48" y="26" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#F8FAFC">SEMANTIC HTML5 &amp; CSS ACADEMIC ARCHITECTURE</text>
    <text x="48" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94A3B8">Engineered for clean information hierarchy, structured tabular data, and accessible form interaction.</text>
    <rect x="580" y="14" width="112" height="28" rx="4" fill="#1D4ED8"/>
    <text x="596" y="32" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF">VIEW LIVE</text>
