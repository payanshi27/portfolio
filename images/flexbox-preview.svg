<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" height="100%">
  <defs>
    <linearGradient id="fqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1726" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="fqAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="fqGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#3B82F6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="760" height="380" rx="8" fill="url(#fqBg)" stroke="#334155" stroke-width="1.5"/>

  <!-- Window Header -->
  <rect x="0" y="0" width="760" height="38" rx="8" fill="#0F172A"/>
  <rect x="0" y="30" width="760" height="8" fill="#0F172A"/>
  <circle cx="20" cy="19" r="5" fill="#EF4444" />
  <circle cx="36" cy="19" r="5" fill="#F59E0B" />
  <circle cx="52" cy="19" r="5" fill="#10B981" />
  <rect x="80" y="10" width="400" height="18" rx="4" fill="#020617"/>
  <text x="92" y="23" font-family="'JetBrains Mono', monospace" font-size="11" fill="#60A5FA">projects/flexbox-quest/ — Game Layout &amp; Flex Dynamics</text>

  <!-- Left: Game Area Simulation -->
  <g transform="translate(24, 54)">
    <rect width="360" height="236" rx="6" fill="#020617" stroke="#1E293B" stroke-width="1.2"/>
    <rect x="0" y="0" width="360" height="32" rx="6" fill="#0F172A"/>
    <text x="16" y="21" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#F8FAFC">⚡ FLEXBOX QUEST // STAGE 01</text>
    <text x="260" y="21" font-family="'JetBrains Mono', monospace" font-size="10" fill="#34D399">❤ 3  ★ 120  LVL 1</text>

    <!-- Game Arena Canvas -->
    <g transform="translate(16, 44)">
      <!-- Target Area -->
      <rect width="328" height="130" rx="4" fill="#0B132B" stroke="#1D4ED8" stroke-width="1" stroke-dasharray="4 3"/>
      <!-- Player Token -->
      <rect x="18" y="22" width="68" height="28" rx="4" fill="#3B82F6" filter="url(#fqGlow)"/>
      <text x="30" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#FFFFFF">PLAYER</text>
      <!-- Star Token -->
      <rect x="238" y="22" width="72" height="28" rx="4" fill="#F59E0B"/>
      <text x="246" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#FFFFFF">⭐ STAR</text>
      <!-- Platform Token -->
      <rect x="80" y="74" width="168" height="20" rx="3" fill="#10B981"/>
      <text x="134" y="88" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">PLATFORM</text>
      <!-- Message -->
      <text x="88" y="118" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8">justify-content: space-between; align-items: center;</text>
    </g>

    <!-- HUD Controls -->
    <g transform="translate(16, 186)">
      <rect width="328" height="36" rx="4" fill="#0F172A" stroke="#1E293B"/>
      <rect x="8" y="6" width="64" height="24" rx="3" fill="#1E293B"/>
      <text x="24" y="22" font-family="'JetBrains Mono', monospace" font-size="10" fill="#93C5FD">PAUSE</text>
      <rect x="80" y="6" width="64" height="24" rx="3" fill="#1E293B"/>
      <text x="96" y="22" font-family="'JetBrains Mono', monospace" font-size="10" fill="#93C5FD">MENU</text>
      <text x="160" y="22" font-family="'JetBrains Mono', monospace" font-size="10" fill="#34D399">● STATUS: RUNNING</text>
    </g>
  </g>

  <!-- Right: Flexbox Layout Inspector -->
  <g transform="translate(404, 54)">
    <rect width="332" height="236" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
    <text x="16" y="26" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#F59E0B">Flexbox Spec &amp; Spatial Alignment</text>

    <g font-family="'JetBrains Mono', monospace" font-size="10.5" transform="translate(16, 40)">
      <rect width="300" height="34" rx="4" fill="#020617" stroke="#1E293B"/>
      <text x="12" y="21" fill="#34D399">display: flex;</text>
      <text x="160" y="21" fill="#94A3B8">/* Main Axis Row */</text>

      <rect y="40" width="300" height="34" rx="4" fill="#020617" stroke="#1E293B"/>
      <text x="12" y="61" fill="#34D399">justify-content:</text>
      <text x="130" y="61" fill="#60A5FA">space-between;</text>

      <rect y="80" width="300" height="34" rx="4" fill="#020617" stroke="#1E293B"/>
      <text x="12" y="101" fill="#34D399">align-items:</text>
      <text x="110" y="101" fill="#60A5FA">center;</text>

      <rect y="120" width="300" height="54" rx="4" fill="#020617" stroke="#1E293B"/>
      <text x="12" y="139" fill="#F59E0B">flex-wrap: wrap;</text>
      <text x="12" y="157" fill="#94A3B8">gap: 16px; /* Dynamic Viewport */</text>
    </g>
  </g>

  <!-- Bottom Guaranteed Bar -->
  <g transform="translate(24, 304)">
    <rect width="712" height="56" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <circle cx="28" cy="28" r="8" fill="#3B82F6" opacity="0.3"/>
    <circle cx="28" cy="28" r="4" fill="#3B82F6"/>
    <text x="48" y="26" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#F8FAFC">INTERACTIVE CSS GAME ENGINE</text>
    <text x="48" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94A3B8">Fluid grid-to-flex transition, real-time bounding box metrics, and tactile responsive controls.</text>
    <rect x="580" y="14" width="112" height="28" rx="4" fill="#3B82F6"/>
    <text x="602" y="32" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF">PLAY LIVE</text>
  </g>
</svg>
